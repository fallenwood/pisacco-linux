# Attended Picasso trial: do not activate or scan before verifying the
# DMS-provisioned permanent WLAN MAC and actual SG regulatory rules.
[device-picasso-wifi]
match-device=interface-name:wlan0
managed=0
wifi.scan-rand-mac-address=no

[connection-picasso-wifi]
match-device=interface-name:wlan0
wifi.cloned-mac-address=permanent
